api:
  base_url: "https://api.deepseek.com/v1"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-chat"

default_level: A2

limits:
  max_history_turns: 20
  max_text_length: 1500

storage:
  db_path: "data/frenchlearner.db"
  session_dir: "data/sessions"

display:
  text_width: 80
  emphasize_new_words: true
